[package]
name = "failtrace"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Deterministic test and typecheck failure reports for coding agents"
repository = "https://github.com/jsquared-labs/failtrace"
readme = "README.md"
publish = false
exclude = [
    ".codex/**",
    ".mcp.json",
    "CLAUDE.md",
    "plans/**",
]

[lib]
path = "src/lib.rs"

[[bin]]
name = "failtrace"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
getrandom = "0.3.4"
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha1 = "0.10.6"
sha2 = "0.10.9"
thiserror = "2.0.12"
time = { version = "0.3.41", features = ["formatting", "macros"] }
unicode-normalization = "0.1.24"
